services:
  # Sidecar: MicroXRCEAgent
  micro_xrce_agent:
    image: px4_jazzy:latest
    container_name: micro_xrce_bridge
    network_mode: host
    restart: unless-stopped
    command: ["MicroXRCEAgent", "udp4", "-p", "8888"]

  # Default Service: Intel Arc, AMD, Universal Mesa (/dev/dri)
  px4_sim:
    image: px4_jazzy:latest
    container_name: px4_sim_jazzy
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    command: ["make", "px4_sitl", "gz_becard"]
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - PX4_GZ_WORLD=default
      - PX4_GZ_TIMEOUT=10000
      - LIBGL_ALWAYS_SOFTWARE=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - ./General_ROS_2_Docker/workspace:/app/ros2_ws
      - ./worlds:/app/PX4-Autopilot/Tools/simulation/gz/worlds
      - ./models:/app/PX4-Autopilot/Tools/simulation/gz/models
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      - micro_xrce_agent

  # Optional Service: Dedicated for NVIDIA GPUs & Jetson
  px4_sim_nvidia:
    image: px4_jazzy:latest
    container_name: px4_sim_jazzy
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    profiles: ["nvidia"]
    command: ["make", "px4_sitl", "gz_becard"]
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - PX4_GZ_WORLD=forest
      - PX4_GZ_TIMEOUT=10000
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - ./worlds:/app/PX4-Autopilot/Tools/simulation/gz/worlds
      - ./models:/app/PX4-Autopilot/Tools/simulation/gz/models
      - ./General_ROS_2_Docker/workspace:/app/ros2_ws
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - micro_xrce_agent
